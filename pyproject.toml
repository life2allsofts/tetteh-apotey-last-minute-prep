[project]
name = "last-minute-prep"
version = "0.1.0"
description = "Offline-first TabPFN study companion for the Ghana Surveyors Licensing Board Examination"
authors = [{ name = "Isaac Tetteh-Apotey", email = "life2allsofts@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", "notebooks", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"